name: Main [.NET MAUI]

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/CommonHelpers/**/*'
      - 'src/CommonHelpers.Maui/**/*'
      #- 'src/CommonHelpers.Tests/**/*'
      #- '.github/workflows/ci_main-maui.yml'

env:
  DOTNET_SDK_VERSION: '10.0.x'
  PROJ_PATH: 'src/CommonHelpers/CommonHelpers.csproj'
  PROJ_PATH_MAUI: 'src/CommonHelpers.Maui/CommonHelpers.Maui.csproj'

jobs:
  build:
    runs-on: windows-latest
    name: 'CI - Main [.NET MAUI]'
    outputs:
      app_version_maui: ${{steps.get-version-maui.outputs.package-version}}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@v7

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{env.DOTNET_SDK_VERSION}}

    # Change the bin's relative path to work in CI
    - name: Update package sources for CI
      run: dotnet nuget update source "CommonHelpersBin" --source "${{github.workspace}}/src/CommonHelpers/bin" --configfile "${{github.workspace}}/src/nuget.config"

    - name: Install .NET Workload (maui)
      run: dotnet workload install maui --source https://api.nuget.org/v3/index.json
    
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Add Alpha (-alpha.${{github.run_number}}) suffix to Version Numbers
      run : |
        [xml]$projXml = get-content "${{env.PROJ_PATH}}"
        Write-Output "Before: " $projXml.Project.PropertyGroup.Version
        $currentVer = $projXml.Project.PropertyGroup.Version
        $suffix = "-alpha.${{github.run_number}}"
        $newVer = $currentVer + $suffix
        $projXml.Project.PropertyGroup.Version = $newVer
        Write-Output "After: " $projXml.Project.PropertyGroup.Version
        $projXml.save("${{env.PROJ_PATH}}")

        [xml]$projXmlMaui = get-content "${{env.PROJ_PATH_MAUI}}"
        $versionNodeMaui = $projXmlMaui.SelectSingleNode('/Project/PropertyGroup/Version')
        Write-Output "Before: " $versionNodeMaui.InnerText
        $newVerMaui = $versionNodeMaui.InnerText + "-alpha.${{github.run_number}}"
        $versionNodeMaui.InnerText = $newVerMaui
        Write-Output "After: " $versionNodeMaui.InnerText
        $projXmlMaui.save("${{env.PROJ_PATH_MAUI}}")

    - name: Get CommonHelpers Version Number From Project
      uses: kzrnm/get-net-sdk-project-versions-action@v3
      id: get-version
      with:
        proj-path: ${{env.PROJ_PATH}}

    - name: Get CommonHelpers.Maui Version Number From Project
      uses: kzrnm/get-net-sdk-project-versions-action@v3
      id: get-version-maui
      with:
        proj-path: ${{env.PROJ_PATH_MAUI}}

    - name: Restore & Build CommonHelpers
      working-directory: src/CommonHelpers
      run: |
        dotnet restore --runtime any --ignore-failed-sources
        dotnet build -c Release --no-restore

    - name: Add CommonHelpers Bin to NuGet Package Sources
      run: dotnet nuget add source "./src/CommonHelpers/bin" --name "CommonHelpers_Bin"

    - name: Restore & Build CommonHelpers.Maui
      working-directory: src/CommonHelpers.Maui
      run: |
        dotnet install "CommonHelpers" --version "${{steps.get-version.outputs.package-version}}"
        dotnet restore --runtime any --ignore-failed-sources
        dotnet build -c Release --no-restore

    - name: Add CommonHelpers.Maui Bin to NuGet Package Sources
      run: dotnet nuget add source "./src/CommonHelpers.Maui/bin" --name "CommonHelpers.Maui_Bin"

    - name: Get nupkg File Paths
      id: get-package-path
      run : |
        # CommonHelpers
        $currentDirectory = Get-Location
        $outputFolder = Join-Path -Path $currentDirectory -ChildPath "src/CommonHelpers/bin/Release/"
        $match = Get-ChildItem $outputFolder -Recurse -Force -Include *.nupkg
        echo "nuget-package-path=$match" >> $env:GITHUB_OUTPUT

        # CommonHelpers.Maui
        $outputFolder = Join-Path -Path $currentDirectory -ChildPath "src/CommonHelpers.Maui/bin/Release/"
        $match = Get-ChildItem $outputFolder -Recurse -Force -Include *.nupkg
        echo "nuget-package-path-maui=$match" >> $env:GITHUB_OUTPUT

    - name: Restore & Build CommonHelpers.Tests
      working-directory: src/CommonHelpers.Tests
      run: |
        dotnet restore --runtime any --ignore-failed-sources
        dotnet build -c Release --no-restore

    - name: Run Tests
      working-directory: src/CommonHelpers.Tests
      run: dotnet test --runtime any -c Release --logger GitHubActions --blame-crash --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: Upload CommonHelpers.Maui NuGet package artifact
      uses: actions/upload-artifact@v7
      with:
        name: "CommonHelpers.Maui.${{steps.get-version-maui.outputs.package-version}}.nupkg"
        path: ${{steps.get-package-path.outputs.nuget-package-path-maui}}

  codesign:
    name: Sign NuGet packages
    needs: [build]
    runs-on: [self-hosted, x64, digicert-enabled]
    env:
      NUPKG_PATH_MAUI: "${{github.workspace}}/CommonHelpers.Maui.${{needs.build.outputs.app_version_maui}}.nupkg"
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{env.DOTNET_SDK_VERSION}}

    - name: Clean packages from runner workspace
      run: Remove-Item -Recurse -Force ${{env.NUPKG_PATH_MAUI}} -ErrorAction SilentlyContinue

    - name: Download nupkg artifact
      uses: actions/download-artifact@v8
      with:
        name: "CommonHelpers.Maui.${{needs.build.outputs.app_version_maui}}.nupkg"
        path: ${{github.workspace}}

    - name: Confirm package exists
      run: |
        if (-not (Test-Path -LiteralPath ${{env.NUPKG_PATH_MAUI}} -PathType Leaf)) {
          throw "NuGet package file not found at ${{env.NUPKG_PATH_MAUI}}"
        }
        Write-Host "NuGet package found at ${{env.NUPKG_PATH_MAUI}}"

    - name: Sign NuGet package
      run: |
        $sacTools = "C:\Program Files\SafeNet\Authentication\SAC\x64\SACTools.exe"
        & $sacTools /Token /LogOn /Password "${{secrets.DIGICERT_HARDWARE_TOKEN_PASSWORD}}"
        if ($LASTEXITCODE -ne 0) { throw "SACTools token logon failed with exit code $LASTEXITCODE" }

        $thumbprint = "8BC202959D2DCE3EEB3A489D8348B5C9B6B64A97"
        $certificate = Get-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -ErrorAction Stop
        $certificateFingerprint = $certificate.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256)

        dotnet nuget sign ${{env.NUPKG_PATH_MAUI}} `
          --certificate-fingerprint $certificateFingerprint `
          --certificate-store-location CurrentUser `
          --certificate-store-name My `
          --hash-algorithm SHA256 `
          --timestamper http://timestamp.digicert.com `
          --timestamp-hash-algorithm SHA256 `
          --verbosity detailed

        if ($LASTEXITCODE -ne 0) { throw "dotnet nuget sign failed with exit code $LASTEXITCODE" }

    - name: Upload signed NuGet package
      uses: actions/upload-artifact@v7
      with:
        name: "CommonHelpers.Maui.${{needs.build.outputs.app_version_maui}}.nupkg"
        path: ${{env.NUPKG_PATH_MAUI}}
        if-no-files-found: error
        retention-days: 30
        overwrite: true
