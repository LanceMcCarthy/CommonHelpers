name: Release [.NET MAUI]

#############################################################
#                       ⚠️ WARNING ⚠️                      #
# Manual trigger only, this workflow publishes to nuget.org #
#############################################################
on:
  workflow_dispatch:

env:
  DOTNET_SDK_VERSION: '10.0.x'
  PROJ_PATH: 'src/CommonHelpers/CommonHelpers.csproj'
  PROJ_PATH_MAUI: 'src/CommonHelpers.Maui/CommonHelpers.Maui.csproj'

jobs:
  build:
    runs-on: windows-latest
    name: 'Build MAUI Release'
    outputs:
      app_version_maui: ${{steps.get-version-maui.outputs.package-version}}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2.21.1 #immutable
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@v7

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{env.DOTNET_SDK_VERSION}}

    # Remove nuget.config now, and only add project bin package sources later after they're created
    - name: Update package sources for CI
      run: rm ${{github.workspace}}/src/nuget.config

    - name: Install .NET Workload (maui)
      shell: pwsh
      run: dotnet workload install maui --source https://api.nuget.org/v3/index.json
    
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Restore & Build CommonHelpers
      working-directory: src/CommonHelpers
      run: |
        dotnet restore --runtime any --ignore-failed-sources
        dotnet build -c Release --no-restore

    - name: Add CommonHelpers Bin to NuGet Package Sources
      run: dotnet nuget add source "${{github.workspace}}/src/CommonHelpers/bin/Release" --name "CommonHelpers_Bin"

    - name: Get Version From Project
      uses: kzrnm/get-net-sdk-project-versions-action@v3
      id: get-version
      with:
        proj-path: src/CommonHelpers/CommonHelpers.csproj

    - name: Get Package File Path
      id: get-package-path
      run : |
        $currentDirectory = Get-Location
        $outputFolder = Join-Path -Path $currentDirectory -ChildPath "src/CommonHelpers/bin/Release/"
        $match = Get-ChildItem $outputFolder -Recurse -Force -Include *.nupkg
        Write-Output "Setting output variable 'nuget-package-path' to $match"
        echo "nuget-package-path=$match" >> $env:GITHUB_OUTPUT

    - name: Restore & Build CommonHelpers.Maui
      working-directory: src/CommonHelpers.Maui
      run: |
        dotnet install "CommonHelpers" --version "${{steps.get-version.outputs.package-version}}"
        dotnet restore --runtime any --ignore-failed-sources
        dotnet build -c Release --no-restore

    - name: Add CommonHelpers.Maui Bin to NuGet Package Sources
      run: dotnet nuget add source "${{github.workspace}}/src/CommonHelpers.Maui/bin/Release" --name "CommonHelpers.Maui_Release"

    - name: Get Maui Version From Project
      uses: kzrnm/get-net-sdk-project-versions-action@v3
      id: get-version-maui
      with:
        proj-path: src/CommonHelpers.Maui/CommonHelpers.Maui.csproj

    - name: Get Maui Package File Path
      id: get-package-path-maui
      run : |
        $currentDirectory = Get-Location
        $outputFolder = Join-Path -Path $currentDirectory -ChildPath "src/CommonHelpers.Maui/bin/Release/"
        $match = Get-ChildItem $outputFolder -Recurse -Force -Include *.nupkg
        Write-Output "Setting output variable 'nuget-package-path-maui' to $match"
        echo "nuget-package-path-maui=$match" >> $env:GITHUB_OUTPUT

    - name: Restore & Build CommonHelpers.Tests
      working-directory: src/CommonHelpers.Tests
      run: |
        dotnet restore --runtime any --ignore-failed-sources
        dotnet build -c Release --no-restore --no-dependencies

    - name: Run Tests
      working-directory: src/CommonHelpers.Tests
      run: dotnet test -c Release --no-build --logger GitHubActions --blame-crash --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: Upload CommonHelpers.Maui NuGet package artifact
      uses: actions/upload-artifact@v7
      with:
        name: "CommonHelpers.Maui.${{steps.get-version-maui.outputs.package-version}}.nupkg"
        path: ${{steps.get-package-path-maui.outputs.nuget-package-path-maui}}

  codesign:
    name: Sign NuGet packages
    needs: [build]
    runs-on: [self-hosted, x64, digicert-enabled]
    env:
      PKG_NAME_MAUI: "CommonHelpers.Maui.${{needs.build.outputs.app_version_maui}}.nupkg"
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{env.DOTNET_SDK_VERSION}}

    - name: Clean bundle workspace
      run: Remove-Item -Recurse -Force "${{github.workspace}}/*.nupkg" -ErrorAction SilentlyContinue

    - name: Download nupkg artifact
      id: dl-commonhelpers-maui-nupkg
      uses: actions/download-artifact@v8
      with:
        name: ${{env.PKG_NAME_MAUI}}

    - name: Confirm package exists
      run: |
        if (-not (Test-Path -LiteralPath "${{steps.dl-commonhelpers-maui-nupkg.outputs.artifact-path}}" -PathType Leaf)) {
          throw "NuGet package file not found at ${{steps.dl-commonhelpers-maui-nupkg.outputs.artifact-path}}"
        }
        Write-Host "NuGet package found at ${{steps.dl-commonhelpers-maui-nupkg.outputs.artifact-path}}"

    - name: Sign NuGet package
      run: |
        $sacTools = "C:\Program Files\SafeNet\Authentication\SAC\x64\SACTools.exe"
        & $sacTools /Token /LogOn /Password "${{secrets.DIGICERT_HARDWARE_TOKEN_PASSWORD}}"
        if ($LASTEXITCODE -ne 0) { throw "SACTools token logon failed with exit code $LASTEXITCODE" }

        $thumbprint = "8BC202959D2DCE3EEB3A489D8348B5C9B6B64A97"
        $certificate = Get-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -ErrorAction Stop
        $certificateFingerprint = $certificate.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256)

        dotnet nuget sign "${{steps.dl-commonhelpers-maui-nupkg.outputs.artifact-path}}" `
          --certificate-fingerprint $certificateFingerprint `
          --certificate-store-location CurrentUser `
          --certificate-store-name My `
          --hash-algorithm SHA256 `
          --timestamper http://timestamp.digicert.com `
          --timestamp-hash-algorithm SHA256 `
          --verbosity detailed

        if ($LASTEXITCODE -ne 0) { throw "dotnet nuget sign failed with exit code $LASTEXITCODE" }

    - name: Upload signed NuGet package
      uses: actions/upload-artifact@v7
      with:
        name: ${{env.PKG_NAME_MAUI}}
        path: "${{steps.dl-commonhelpers-maui-nupkg.outputs.artifact-path}}"
        if-no-files-found: error
        retention-days: 30
        overwrite: true

  release:
    name: Push Releases
    needs: [build, codesign]
    runs-on: windows-latest
    permissions:
      contents: write  # Create the GitHub prerelease
      id-token: write  # OIDC for NuGet.org
    env:
      PKG_NAME_MAUI: "CommonHelpers.Maui.${{needs.build.outputs.app_version_maui}}.nupkg"
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2.21.1 #immutable
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@v7

    - name: Download nupkg artifact
      id: dl-commonhelpers-maui-nupkg
      uses: actions/download-artifact@v8
      with:
        name: ${{env.PKG_NAME_MAUI}}

    - name: Confirm package exists
      run: |
        if (-not (Test-Path -LiteralPath "${{steps.dl-commonhelpers-maui-nupkg.outputs.artifact-path}}" -PathType Leaf)) {
          throw "NuGet package file not found at ${{steps.dl-commonhelpers-maui-nupkg.outputs.artifact-path}}"
        }
        Write-Host "NuGet package found at ${{steps.dl-commonhelpers-maui-nupkg.outputs.artifact-path}}"

    - name: NuGet login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  #v1.2.0
      id: ngt-login
      with:
        user: LancelotSoftware

    - name: Publish CommonHelpers.Maui to NuGet.org
      run: dotnet nuget push "${{steps.dl-commonhelpers-maui-nupkg.outputs.artifact-path}}" --source https://api.nuget.org/v3/index.json --api-key ${{steps.ngt-login.outputs.NUGET_API_KEY}}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3.0.3
      with:
        tag_name: "v${{needs.build.outputs.app_version_maui}}"
        name: ${{env.PKG_NAME_MAUI}}
        draft: false
        prerelease: false
        files: "${{steps.dl-commonhelpers-maui-nupkg.outputs.artifact-path}}"